arch:
  # RECONSTRUCTED 2026-07-20: the original configs/arch/ptb.yaml was lost
  # from disk (it was always gitignore'd, never committed). Rebuilt from
  # the ptb pilot log's field-by-field documentation of every value below;
  # not verified byte-identical to the original file. If a fresh solve
  # against this file doesn't reproduce a cached ptb schedule's
  # currently-cached dram_num_steps, treat this reconstruction (not the
  # cached schedule) as the suspect.
  bitwidths:
    BW_WEIGHT: 8
    BW_PSUM:   16
    BW_VMEM:   32
    DRAM_LATENCY: 0.25

  # single_node: PTB's systolic array is fed directly from its own
  # buffers -- no inter-node NoC (mirrors spinalflow.yaml/loas.yaml).
  single_node: true

  storage:             # innermost first
    - name: NodeLevel
      instances: 1
      pe:
        num_pes: 128
    - name: NoCLevel
      # entries omitted: no physical Global Buffer exists (single_node:
      # true), so there's nothing real to size.
      instances: 1
    - name: OffChip
      instances: 1
