dataflow:
  # Campaign copy (2026-11-10) of fig3's prosperity_fig3.yaml: COUT fanout 4
  # (down from the published 8); CIN resident at up to 16; KH/KW capped at 4
  # so a whole 3x3 kernel is resident per tile; HO residency 8; T fully
  # resident. COUT spatial 4 exactly fills the 4-PE node. WO is absent, so it
  # is barred from NodeLevel residency (absent == cap 1 per node_capacity.py).
  # The gen_inputs.py kernel_tile_bound gate passes with zero violations
  # (8,192 tiles on a real 3x3 layer; prefix compression active at ~2x); the
  # bridge expands CIN per channel. The psum boundary remains T <= 16 (KH/KW
  # are not in that term); six A08 T=32 layers remain infeasible.
  node_dim_capacity:
    KH:   4
    KW:   4
    CIN:  16
    COUT: {spatial: 4}
    HO:   8
    T:    full
