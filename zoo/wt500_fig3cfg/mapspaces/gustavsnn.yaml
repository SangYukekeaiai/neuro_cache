dataflow:
  # Campaign copy (2026-11-10) of fig3's gustavsnn_fig3.yaml, kept as-is
  # per user instruction: full reduction row resident; COUT fanout 2 and HO
  # fanout 2 (down from the published 4/4), so the spatial product 2x2 = 4
  # exactly fills the 4-PE node; WO capped at 1 (one output column resident;
  # it is not part of the NodeLevel spatial product, so wave width is
  # unaffected: COUT 2 x HO 2 = 4 where both split); T barred from NodeLevel.
  node_dim_capacity:
    KH:   full
    KW:   full
    CIN:  full
    COUT: {spatial: 2}
    HO:   {spatial: 2}
    WO:   1
